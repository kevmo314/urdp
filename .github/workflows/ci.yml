name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxext-dev libxtst-dev libxcomposite-dev libxdamage-dev libxrandr-dev \
            libx264-dev libopus-dev libpulse-dev libpipewire-0.3-dev libvpx-dev xvfb xterm xdotool \
            pulseaudio pulseaudio-utils ffmpeg
      # The virtual device tests skip themselves if these fail.
      - name: Virtual device setup (uinput, PulseAudio)
        continue-on-error: true
        run: |
          sudo modprobe uinput
          sudo chmod 666 /dev/uinput
          echo 'KERNEL=="event*", ATTRS{name}=="Microsoft X-Box 360 pad", MODE="0666"' |
            sudo tee /etc/udev/rules.d/99-urdp-test.rules
          sudo udevadm control --reload-rules
          pulseaudio --start --exit-idle-time=-1
          pactl info
      # A PipeWire session (no pipewire-pulse: PulseAudio above serves the
      # mic test) for the PipeWire camera.
      - name: Virtual device setup (PipeWire)
        continue-on-error: true
        run: |
          sudo apt-get install -y pipewire pipewire-bin wireplumber gstreamer1.0-pipewire gstreamer1.0-tools
          if [ -z "$XDG_RUNTIME_DIR" ]; then
            export XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg && mkdir -m 700 -p $XDG_RUNTIME_DIR
            echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> $GITHUB_ENV
          fi
          nohup pipewire > $RUNNER_TEMP/pipewire.log 2>&1 &
          sleep 1
          nohup wireplumber > $RUNNER_TEMP/wireplumber.log 2>&1 &
          sleep 2
          pw-cli ls Node
      - name: Virtual device setup (v4l2loopback)
        continue-on-error: true
        run: |
          sudo apt-get install -y linux-headers-$(uname -r) v4l2loopback-dkms
          sudo modprobe v4l2loopback exclusive_caps=1 card_label="urdp Camera"
          sudo chmod 666 /dev/video*
          ls -l /dev/video*
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: xvfb-run -a -s "-screen 0 1280x720x24" go test -race ./...
      - name: Build
        run: go build -o urdp .
      - name: End-to-end latency (Chrome)
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 1
          DISPLAY=:99 ./urdp -addr 127.0.0.1:8000 -audio 0 &
          sleep 1
          DISPLAY=:99 node scripts/e2e.mjs 'http://localhost:8000/?probe' 12 250
      - uses: actions/upload-artifact@v4
        with:
          name: urdp-linux-amd64
          path: urdp

  windows:
    # Cross-compiled with mingw-w64 against static x264/Opus, producing a
    # single self-contained urdp.exe.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 nasm pkg-config
      - uses: actions/cache@v4
        with:
          path: third_party/windows
          key: windows-deps-${{ hashFiles('scripts/build-windows-deps.sh') }}
      - name: Build x264 and Opus
        run: scripts/build-windows-deps.sh
      - name: Vet
        run: make vet-windows
      - name: Build
        run: make windows
      - uses: actions/upload-artifact@v4
        with:
          name: urdp-windows-amd64
          path: bin/urdp.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install dependencies
        run: brew install x264 opus pkg-config nasm
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Test the audio driver
        run: make mac-driver-test
      - name: Build static codecs
        run: make mac
      - name: Check runtime dependencies
        run: |
          otool -L bin/urdp
          if otool -L bin/urdp | grep -E '/(opt/homebrew|usr/local)/'; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: urdp-macos
          path: bin/urdp
